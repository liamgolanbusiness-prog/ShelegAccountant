<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06091e"/>
      <stop offset=".5" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#0e1a44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9ad7ff"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#f4d27c"/>
    </linearGradient>
    <radialGradient id="g1" cx=".15" cy=".2" r=".6">
      <stop offset="0" stop-color="#1f4fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#1f4fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".85" cy=".8" r=".6">
      <stop offset="0" stop-color="#d4af37" stop-opacity=".4"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- decorative snowflake -->
  <g transform="translate(940,180)" opacity=".35">
    <g fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round">
      <path d="M0 -130 V 130"/>
      <path d="M -130 0 H 130"/>
      <path d="M -92 -92 L 92 92"/>
      <path d="M 92 -92 L -92 92"/>
      <path d="M0 -100 L -22 -78 M0 -100 L 22 -78"/>
      <path d="M0 100 L -22 78 M0 100 L 22 78"/>
      <path d="M -100 0 L -78 -22 M -100 0 L -78 22"/>
      <path d="M 100 0 L 78 -22 M 100 0 L 78 22"/>
    </g>
    <circle r="9" fill="url(#gold)"/>
  </g>

  <!-- Title (Hebrew RTL — visual) -->
  <g font-family="Heebo, Arial, sans-serif" text-anchor="end">
    <text x="1100" y="270" font-size="84" font-weight="900" fill="url(#gold)">ש.ל.ג חשבונאות ומיסים</text>
    <text x="1100" y="335" font-size="42" font-weight="600" fill="#c7d1ee">רו״ח ינוקא לבן · ייעוץ פיננסי שיוצר ערך</text>
    <text x="1100" y="430" font-size="28" font-weight="500" fill="#8593b9">הנהלת חשבונות · ייעוץ מס · שכר · דוחות שנתיים · ליווי עסקי</text>
  </g>

  <!-- bottom bar -->
  <rect x="100" y="540" width="1000" height="2" fill="url(#gold)" opacity=".5"/>
  <text x="1100" y="585" font-family="Heebo, Arial, sans-serif" text-anchor="end" font-size="22" font-weight="700" fill="#9ad7ff">sheleg-cpa.co.il</text>
</svg>
